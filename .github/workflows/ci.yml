name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Engineering quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package and quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Ruff delta quality and architecture debt
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/engineering_quality_gate.py --base-ref "$QUALITY_BASE_SHA"

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Validate extension JavaScript syntax
        run: python tools/check_extension_js_syntax.py

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Run test suite
        run: python -m pytest -q

  macos-wk:
    name: macOS WKWebView integration
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package, tests and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
          python -m pip install build

      - name: Validate packaged JavaScript syntax
        run: python tools/check_extension_js_syntax.py

      - name: Compile WK helper with strict warnings
        run: |
          clang -fobjc-arc -Wall -Wextra -Werror \
            -framework Cocoa -framework WebKit \
            src/chatgpt_web_adapter/wkwebview_helper/WKChatGPTAuthority.m \
            -o "${RUNNER_TEMP}/WKChatGPTAuthority"

      - name: Run targeted WK and release tests
        run: >-
          python -m pytest -q
          tests/test_wkwebview_backend.py
          tests/test_wkwebview_lightweight_transport.py
          tests/test_wkwebview_temporary.py
          tests/test_wkwebview_stream_observation.py
          tests/test_wkwebview_integrity_fixtures.py
          tests/test_release_hardening_pr8_17.py

      - name: Build macOS release artifacts
        run: python -m build

      - name: Validate macOS release artifact contract
        run: python tools/release_gate.py --dist-dir dist

      - name: Smoke exact installed wheel and build packaged WK helper
        run: python tools/installed_wheel_smoke.py --wheel-dir dist

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs:
      - quality
      - tests
      - macos-wk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Validate release artifact contract
        run: python tools/release_gate.py --dist-dir dist

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: cwa-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  installed-wheel-smoke:
    name: Installed wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.14"

    steps:
      - name: Check out release smoke tooling
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download exact built distributions
        uses: actions/download-artifact@v4
        with:
          name: cwa-dist
          path: dist

      - name: Install and smoke-test exact wheel outside source imports
        run: python tools/installed_wheel_smoke.py --wheel-dir dist
